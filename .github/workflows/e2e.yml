name: E2E tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ephemeral Postgres for this run only — separate from the Supabase test
    # schema used for local dev (see apps/web/e2e/README.md). No provisioning
    # step needed; GitHub Actions waits for the health check before the job
    # continues.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dolang_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Consumed by apps/web/playwright.config.ts (overrides the API's
      # DATABASE_URL for the spawned dev-server process) and by
      # apps/web/e2e/global-setup.ts (migrate + seed before the suite runs).
      PLAYWRIGHT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dolang_e2e
      # Only JWT_SECRET is required for the API to boot — every other
      # integration (AI providers, Stripe, SMTP, R2, ElevenLabs, Deepgram)
      # degrades gracefully when unset, by existing app design.
      JWT_SECRET: ci-e2e-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
